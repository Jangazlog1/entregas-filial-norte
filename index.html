<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Entregas Filial Norte</title>
<style>:root{color-scheme:light;--bg:#f5f2f2;--card:#fff;--ink:#25140f;--ink2:#6b514b;--ink3:#9a7f79;--line:#ecdedc;--line2:#f7efee;--brand:#b21016;--brand2:#e02128;--brand3:#7d0a10;--accent:#c4161c;--chip:#fdeced;--chip-ink:#a5121a;--bar-bg:#f1e2e2;--green:#16b84a;--warn:#d08a00;--bad:#c4161c;--okbg:#e3f5ea;--ok:#0f8a45;--warnbg:#fdf1d8;--blue:#1d5fb8;--bluebg:#e4eefb;--shadow:0 1px 2px rgba(40,10,10,.06),0 8px 24px rgba(40,10,10,.05);
 --dk:#1f1717;--dk2:#2a2020;--dkline:#3d2b2b;--dkink:#f6eceb;--dkmut:#c2aaa6;--dkred:#ff5a61}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;font:700 13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body *{font-weight:700}
.wrap{max-width:1760px;margin:0 auto;padding:12px 16px 24px}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:7px 18px;background:linear-gradient(135deg,var(--brand3),var(--brand2));color:#fff;border-radius:13px;box-shadow:var(--shadow)}
.hl{grid-column:2;display:flex;align-items:center;justify-content:center;gap:22px}
.logo img{height:48px;display:block;border-radius:9px;background:#fff}
header h1{margin:0;font-size:22px;font-weight:900;line-height:1.15;color:#fff}
header p{margin:1px 0 0;font-size:12px;color:#fff}
.badge{grid-column:3;justify-self:end;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:4px 10px;font-size:10.5px;line-height:1.35;text-align:right}
.badge b{display:block;font-size:13px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;margin-top:10px;align-items:start}
main{min-width:0}
.kpi,.fcard{background:linear-gradient(180deg,#261c1c,#1b1414);border:1px solid var(--dkline);border-radius:12px;color:var(--dkink);box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 22px rgba(40,10,10,.18)}
.lk{all:unset;cursor:pointer;color:#ff7a80;font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none}
.lk:hover{text-decoration:underline}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--brand2);padding-bottom:3px;margin-bottom:8px}
.sig{font-weight:900;letter-spacing:.03em;color:var(--accent);font-size:16px}
.sig.big{font-size:18px}
.cid{font-size:11.5px;color:var(--ink3);margin-left:7px}
.ring{width:48px;height:48px}
.vhead .ring{width:34px;height:34px}
.ring .rb{fill:none;stroke:var(--bar-bg);stroke-width:7}
.ring .rf{fill:none;stroke-width:7;stroke-linecap:round}
.ring text{font-size:12.5px;font-weight:900;fill:var(--ink)}
.ring.na{width:34px;height:34px;border-radius:50%;border:4px solid var(--bar-bg);display:grid;place-items:center;color:var(--ink3);font-size:11px}
.fchip{display:inline-flex;gap:8px;align-items:center;margin:0 0 10px;padding:5px 10px;border-radius:20px;background:var(--chip);color:var(--chip-ink);font-size:12px}
.mchip{display:inline-flex;gap:8px;align-items:center;margin:0 0 10px 6px;padding:5px 12px;border-radius:20px;background:#e3f5ea;color:#0f6b35;border:1px solid #a8dcbb;font-size:12.5px}
.mchip b{color:#0b3f20}
.fchip .lk,.mchip .lk{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{padding:9px 13px}
.kpi .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dkmut)}
.kpi .val{font-size:21px;font-weight:900;margin-top:2px;color:#fff;font-variant-numeric:tabular-nums}
.kpi.money .val{color:var(--dkred)}
.kpi .sub{font-size:11px;color:var(--dkmut);margin-top:1px}
.rank{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 6px;margin:10px 0;box-shadow:var(--shadow)}
.rh{text-align:center;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);font-size:12px}
.rh small{display:block;text-transform:none;letter-spacing:0;color:var(--ink3);font-size:10.5px;margin-top:2px}
.rkw{display:flex;align-items:stretch;gap:10px;padding:6px 2px 0}
.rk{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:8px;padding:4px 2px;transition:opacity .15s,background .15s}
.rk:hover{background:rgba(22,184,74,.07)}
.rk.dim{opacity:.35}
.rk.sel{background:rgba(22,184,74,.10);outline:1px solid rgba(22,184,74,.5)}
.rk:focus-visible{outline:2px solid var(--green)}
.rkb{height:84px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.rkb i{flex:none;display:block;width:100%;background:var(--green);border-radius:3px 3px 0 0}
.rkv,.rks{background:#fff;color:#111;font-weight:900;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;box-shadow:0 1px 2px rgba(0,0,0,.08);flex:none}
.rks{font-size:11.5px;padding:1px 7px}
.rkv{background:#111;color:#fff;border-color:#111}
.rkn{font-size:8.5px;font-weight:900;color:var(--ink);text-align:center;text-transform:uppercase;line-height:1.2;letter-spacing:-.01em;min-height:4.8em;align-self:stretch;overflow-wrap:anywhere;display:flex;align-items:flex-start;justify-content:center}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.fcard{display:block;text-decoration:none;border-top:4px solid var(--brand2);padding:9px 12px;cursor:pointer}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .sig{color:var(--dkred)}
.fcard .cid{color:#b09995}
.fcard .ring{width:42px;height:42px}
.fcard .ring .rb{stroke:var(--dkline)}
.fcard .ring text{fill:#fff}
.fm{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--dkmut)}
.fm b{display:block;font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.go{margin-top:4px;font-size:11.5px;color:#ff7a80}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;min-width:0}
.phead{background:var(--line2);padding:7px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--line)}
.panel.done .phead{background:var(--okbg);color:var(--ok)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line2)}
tr.click{cursor:pointer}
th.n,td.n{text-align:right}
td.cids{max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-size:12.3px}
td.late{color:var(--bad)}
.pl{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--line2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.pb{display:flex;align-items:center;gap:7px;min-width:130px}
.pb .bar{width:80px;height:7px;border-radius:4px;background:var(--bar-bg);overflow:hidden}
.pb .bar i{display:block;height:100%;border-radius:4px;background:var(--green)}
.pb span{font-size:11.5px;color:var(--ink2);min-width:42px}
.st{font-size:11px;border-radius:20px;padding:2px 9px;white-space:nowrap}
.st.rota{background:var(--bluebg);color:var(--blue)}
.st.pend{background:var(--warnbg);color:var(--warn)}
.bel{font-size:9.5px;color:var(--chip-ink);background:var(--chip);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.mes{font-size:9.5px;color:var(--ink2);background:var(--line2);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;text-transform:uppercase}
.new{font-size:9.5px;color:#fff;background:var(--blue);border-radius:4px;padding:0 4px;margin-left:4px}
.re{font-size:9.5px;color:var(--warn);background:var(--warnbg);border-radius:4px;padding:0 4px;margin-left:4px}
.oc{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--line2);color:var(--ink2)}
.oc.o85,.oc.o15{background:var(--bluebg);color:var(--blue)}
.oc.o34,.oc.o24,.oc.o35,.oc.o11,.oc.o13,.oc.o9,.oc.o10,.oc.o16,.oc.o49,.oc.o6,.oc.o83,.oc.o95,.oc.o73{background:var(--warnbg);color:var(--warn)}
.oc.o38,.oc.o36,.oc.o53,.oc.o23,.oc.o54,.oc.o5,.oc.o20{background:var(--chip);color:var(--bad)}
.none{color:var(--ink3);font-style:italic;text-align:center}
.msub{color:var(--accent);margin:4px 0 6px;font-size:14px}
.msub small{color:var(--ink3)}
.geral{background:var(--card);border:2px solid var(--brand2);border-radius:11px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.geral .gh{background:linear-gradient(135deg,var(--brand3),var(--brand2));color:#fff;padding:7px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
tfoot td{border-top:2px solid var(--line);background:var(--line2)}
.ctx{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 15px;font-size:12.3px;color:var(--ink2);box-shadow:var(--shadow)}
.ctx b{color:var(--ink)}
@media(max-width:1100px){header.top{grid-template-columns:1fr}
.hl,.badge{grid-column:1;justify-self:center}
.badge{text-align:center}}
@media(max-width:900px){.wrap{padding-left:12px;padding-right:12px}
.layout{grid-template-columns:minmax(0,1fr)}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.fcards{grid-template-columns:minmax(0,1fr)}
.rkw{overflow-x:auto;padding-top:22px;padding-bottom:6px}
.rk{flex:0 0 84px}
.vhead .cid{display:block;margin-left:0}}
@media(max-width:640px){header.top{padding:10px 12px}
.hl{flex-direction:column;gap:8px;text-align:center}
.logo img{height:44px}
header h1{font-size:19px}
header p{font-size:11px}
.kpi .val{font-size:18px}
.kpi .lab{font-size:9.5px}}
.rkb i{border:2px solid #111;border-bottom-width:1px}
.kpi,.fcard{border:1.5px solid var(--brand2);border-top:4px solid var(--brand2)}
.kpi *,.fcard *{color:#fff!important;font-weight:900!important}
.fcard .ring text{fill:#fff}
.kpi .sub,.fm{opacity:1}
.kpi .lab,.rh,.fcard .fh>div:first-child{display:inline-block;background:#1f1414;border:1.5px solid var(--brand2);border-radius:8px;padding:3px 10px;letter-spacing:.08em;text-transform:uppercase}
.kpi .lab,.kpi .lab *,.rh,.fcard .fh>div:first-child,.fcard .fh>div:first-child *{color:#ff6b72!important;font-weight:900!important}
.kpi .lab{font-size:10.5px;margin-bottom:2px}
.rk-head{text-align:center}
.rh{font-size:12px}
.fcard .fh>div:first-child .cid{margin-left:6px}
header h1,header p{text-transform:uppercase}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0;padding:10px 13px 8px;border:1.5px solid var(--brand2);border-top:3px solid var(--brand2);border-radius:12px}
.kpi .lab{display:block;background:none;border:0;border-radius:0;padding:0;margin:0;font-size:10px;letter-spacing:.09em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:24px;line-height:1.15;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi.fin .val{color:#3ddc75!important}
.kpi.money .val{color:#ff6b72!important}
.kpi .dl{font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .dl b.good{color:#3ddc75!important}
.kpi .dl b.bad{color:#ff6b72!important}
.kpi .dl b.eq{color:#fff!important}
.kpi .dl span,.kpi .ft2{color:#c2aaa6!important}
.kpi .spw{position:relative;height:30px;margin:5px 0 3px}
.kpi .spw svg{display:block;width:100%;height:100%;overflow:visible}
.kpi .spw .sl{fill:none;stroke:#ff6b72;stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kpi .spw .sa{fill:rgba(224,33,40,.22)}
.kpi.fin .spw .sl{stroke:#3ddc75}
.kpi.fin .spw .sa{fill:rgba(22,184,74,.20)}
.kpi .spw .sd{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 0 0 2px rgba(255,107,114,.55)}
.kpi .ft2{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .val{font-size:19px}
.kpi .lab,.kpi .dl,.kpi .ft2{white-space:normal}}
.layout{grid-template-columns:minmax(0,1fr)}
.hr{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px}
.hr .badge{grid-column:auto;justify-self:auto}
.dd{position:relative}
@media(max-width:1100px){.hr{grid-column:1;justify-self:center;flex-wrap:wrap;justify-content:center}}
.hr .badge{flex:none;white-space:nowrap}
@media(max-width:1400px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi .val{font-size:21px}}
@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .val{font-size:24px}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi .val{font-size:19px}}
#lbF::first-letter{text-transform:uppercase}
.flt{display:flex;align-items:center;gap:7px}
.fl{font-size:11.5px;font-weight:900;color:#fff;white-space:nowrap}
.dh-btn{all:unset;box-sizing:border-box;font-family:inherit;font-weight:800;font-size:13px;line-height:1.35;color:var(--ink);background:#fff;border:1.5px solid #ffd0d2;border-radius:6px;padding:6px 30px 6px 10px;min-width:170px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative}
.dh-btn::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg)}
.dd.open .dh-btn{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.dh-btn:focus-visible{outline:2px solid #fff;outline-offset:1px}
.dh-pop{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:#fff;border:1.5px solid var(--brand2);border-radius:8px;box-shadow:0 10px 28px rgba(40,10,10,.22);min-width:260px;max-height:360px;overflow:auto;padding:6px;text-align:left}
.dd.open .dh-pop{display:block}
.dh-it{display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;font-family:inherit;font-weight:800;font-size:13px;line-height:1.35;color:var(--ink);background:none;border:0;border-radius:5px;padding:6px 8px;text-align:left;cursor:pointer;white-space:nowrap}
.dh-it:hover{background:var(--chip)}
.dh-it.on{background:var(--brand2);color:#fff}
.dh-it .q{margin-left:auto;padding-left:12px;font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.dh-tg{width:18px;flex:0 0 18px;text-align:center;font-size:11px;transition:transform .15s}
.dh-m.ab .dh-tg{transform:rotate(90deg)}
.dh-ds{padding-left:22px}
.dh-ds[hidden]{display:none}
@media(max-width:1100px){.dh-pop{right:auto;left:0}}
@media(max-width:640px){.flt{flex-direction:column;align-items:stretch;gap:3px}
.fl{text-align:left}
.dh-pop{min-width:min(260px,calc(100vw - 48px))}}
@media(max-width:640px){.dh-pop{left:50%;right:auto;transform:translateX(-50%);min-width:0;width:calc(100vw - 48px)}
.dh-it{white-space:normal}}
.rkb i{background:linear-gradient(180deg,#ff3b44,#d3101a);box-shadow:0 0 8px rgba(255,42,51,.75),0 0 20px rgba(255,42,51,.40)}
.rk:hover{background:rgba(255,42,51,.07)}
.rk.sel{background:rgba(255,42,51,.10);outline:1px solid rgba(255,42,51,.55)}
.rk:focus-visible{outline:2px solid #ff2a33}
.fundo{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.fundo::before,.fundo::after{content:'';position:absolute;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.22}
.fundo::before{width:46vw;height:46vw;left:-10vw;top:-12vw;background:radial-gradient(circle,#e3121b 0%,transparent 65%);animation:flutua1 18s ease-in-out infinite alternate}
.fundo::after{width:40vw;height:40vw;right:-8vw;bottom:-14vw;background:radial-gradient(circle,#8f0f17 0%,transparent 65%);animation:flutua2 22s ease-in-out infinite alternate}
@keyframes flutua1{to{transform:translate(38vw,30vh) scale(1.15)}}
@keyframes flutua2{to{transform:translate(-42vw,-34vh) scale(1.2)}}
.wrap{position:relative;z-index:1;background:repeating-linear-gradient(115deg,rgba(197,19,29,.035) 0 2px,transparent 2px 26px)}
.wrap::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(100deg,transparent 30%,rgba(227,18,27,.07) 45%,rgba(255,255,255,.35) 50%,rgba(227,18,27,.07) 55%,transparent 70%);
 background-size:250% 100%;animation:varre 9s linear infinite}
@keyframes varre{from{background-position:120% 0}to{background-position:-120% 0}}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes giro{to{--ang:360deg}}
header.top,.kpi,.fcard,.rank,.panel,.geral{position:relative}
header.top::after,.kpi::after,.fcard::after,.rank::after,.panel::after,.geral::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:2.5px;pointer-events:none;z-index:4;
 background:conic-gradient(from var(--ang),transparent 0 70%,#ff2a33 82%,#fff 86%,#ff2a33 90%,transparent 98%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:giro 4s linear infinite}
header.top::after{animation-duration:6s;padding:3px}
.kpi::after{animation-duration:5s;padding:2px}
.kpi:nth-child(2)::after{animation-delay:-.7s}
.kpi:nth-child(3)::after{animation-delay:-1.4s}
.kpi:nth-child(4)::after{animation-delay:-2.1s}
.kpi:nth-child(5)::after{animation-delay:-2.8s}
.kpi:nth-child(6)::after{animation-delay:-3.5s}
.fcard:nth-child(2)::after{animation-delay:-1s}
.fcard:nth-child(3)::after{animation-delay:-2s}
.fcard:nth-child(4)::after{animation-delay:-3s}
.kpi,.fcard{transition:box-shadow .25s,transform .25s}
.kpi:hover,.fcard:hover{box-shadow:0 0 0 1px #e3121b,0 0 18px rgba(227,18,27,.45);transform:translateY(-1px)}
.panel tbody tr:hover,.geral tbody tr:hover{background:#fff5f5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== tema TC Top Cargas (16/11/2026): cabeçalho e cores da TC ===== */
:root{--bg:#f2f5fa;--line:#dbe3f0;--line2:#eef3fa;--brand:#0a3aa8;--brand2:#0c45c4;--brand3:#012c8b;--accent:#0c45c4;--chip:#e3ebfb;--chip-ink:#0a3aa8;--bar-bg:#e1e8f4;--ink2:#46526b;--ink3:#6f7c96;--dkline:#24365e;--dkmut:#a9b8d6;--dkred:#8fb8ff}
header.top{background:linear-gradient(100deg,#012c8b 0%,#0a3aa8 35%,#0c45c4 60%,#012c8b 100%)}
.logo img{height:52px;background:none;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.kpi,.fcard{background:linear-gradient(180deg,#14233f,#0a1530);border-color:var(--brand2)}
.kpi .lab,.kpi .lab *,.rh,.fcard .fh>div:first-child,.fcard .fh>div:first-child *{color:#8fb8ff!important}
.rh,.fcard .fh>div:first-child{background:#0b1730!important;border-color:var(--brand2)!important}

  h+='<div class="fcards">';
  var rows='';D.fil.forEach(function(f){var k=kpis(f[0]);
   h+='<a class="fcard" href="#'+f[0]+'" data-go="'+f[0]+'"><div class="fh"><div><span class="sig">'+f[0]+'</span><span class="cid">'+f[1]+'</span></div>'+ring(k.fp,52)+'</div><div class="fm"><div>'+(todos()?MES[HM].charAt(0).toUpperCase()+MES[HM].slice(1):'Filtro')+'<b>'+(k.fp===null?'—':br(k.F.e)+'/'+br(k.F.c))+'</b></div><div>Em aberto<b>'+k.R.n+'</b></div><div>Frete aberto<b>R$ '+br(k.R.fr,2)+'</b></div></div><div class="go">abrir filial →</div></a>';
   rows+='<tr class="click" data-go="'+f[0]+'"><td><span class="sig">'+f[0]+'</span><span class="cid">'+f[1]+'</span></td><td class="n">'+(k.fp===null?'—':br(k.F.c))+'</td><td class="n">'+(k.fp===null?'—':br(k.F.e))+'</td><td>'+(k.fp===null?'—':pbar(k.fp))+'</td><td class="n">'+k.R.n+'</td><td class="n">'+k.R.rota+'</td><td class="n">'+k.R.ant+'</td><td class="n">'+k.R.veic+'</td><td class="n money">'+br(k.R.fr,2)+'</td><td class="n">'+br(k.R.kg)+'</td></tr>';});
  var K2=kpis(null);
  h+='</div><div class="geral"><div class="gh">Consolidado por filial</div><div class="scroll"><table><thead><tr><th>Filial</th><th class="n">CTRCs</th><th class="n">Entregues</th><th>Finalização</th><th class="n">Em aberto</th><th class="n">Em rota</th><th class="n">Meses ant.</th><th class="n">Veículos</th><th class="n">Frete aberto</th><th class="n">Peso aberto (kg)</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td><span class="sig">FILIAL NORTE</span></td><td class="n">'+(K2.fp===null?'—':br(K2.F.c))+'</td><td class="n">'+(K2.fp===null?'—':br(K2.F.e))+'</td><td>'+(K2.fp===null?'—':pbar(K2.fp))+'</td><td class="n">'+K2.R.n+'</td><td class="n">'+K2.R.rota+'</td><td class="n">'+K2.R.ant+'</td><td class="n">'+K2.R.veic+'</td><td class="n">'+br(K2.R.fr,2)+'</td><td class="n">'+br(K2.R.kg)+'</td></tr></tfoot></table></div></div>';
  h+='<div class="ctx">Painel mostra <b>somente os CTRCs ainda não entregues</b>: romaneios de '+MES[HM]+' e o que ficou em aberto dos meses anteriores (etiqueta com o mês). <b>Entregue</b> = ocorrência 01 ou 37. Romaneio cancelado fica fora; CTRC em mais de um romaneio conta uma vez, pelo mais recente. <b>Em rota</b> = romaneio PENDENTE; <b>baixado c/ pendência</b> = romaneio já baixado com CTRC que voltou sem entrega. Frete da <b>BELENUS</b> no UDX é cortesia (centavos). O filtro de datas usa a <b>data de saída do romaneio</b>.</div>';
 }else{var f=D.fil.filter(function(x){return x[0]===view;})[0],K=kpis(view),L=fAb(view);
  h+='<div class="vhead"><div><span class="sig big">'+f[0]+'</span><span class="cid">'+f[1]+'</span></div>'+ring(K.fp,64)+'</div>'+filtro+motChip()+K.html+tabRom(view,porMot(L))+tabCtrc(porMot(L))+tabBx(porMot(fBx(view)));}
 document.getElementById('main').innerHTML=h;}

function motChip(){return (busca.length?'<div class="mchip bchip">Pesquisa: <b>'+esc(busca.join(', '))+'</b> · '+porMot(fAb(view==='GERAL'?null:view)).length+' em aberto <button class="lk" data-busca-clear="1">limpar</button></div>':'')+(motSel?'<div class="mchip">Motorista: <b>'+esc(motSel)+'</b> <button class="lk" data-mot-clear="1">limpar</button></div>':'');}
function porMot(L){return motSel?L.filter(function(a){return cap(a.mot)===motSel;}):L;}
function renderDD(){var f=D.fil.filter(function(x){return x[0]===view;})[0];document.getElementById('lbF').textContent=rotBtn();document.getElementById('lbN').textContent=f?f[0]+' · '+f[1]:'Visão geral';}
function closeDD(){[].forEach.call(document.querySelectorAll('.dd.open'),function(x){x.classList.remove('open');});}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDD();});
var tB=null;function aplicaBusca(v){busca=String(v||'').toUpperCase().split(/[\s,;]+/).filter(function(x){return x.length>0;});motSel=null;renderNav();renderMain();}
document.addEventListener('input',function(e){if(e.target&&e.target.id==='qNF'){clearTimeout(tB);var v=e.target.value;tB=setTimeout(function(){aplicaBusca(v);},250);}});
function linhasXls(){var sv=view==='GERAL'?null:view,L=porMot(fAb(sv)),B=porMot(fBx(sv));
 var cab=['Filial','Romaneio','Saída','Situação','Placa','Motorista','NF','CTRC','Remetente','Destinatário','Cidade','Cód. ocorrência','Última ocorrência','Desde','Dias parado','Frete (R$)','Peso (kg)','Volumes','Valor mercadoria (R$)','Saídas'];
 var ab=L.slice().sort(function(a,b){return a.s.localeCompare(b.s)||ord(a.d)-ord(b.d)||a.rom.localeCompare(b.rom);}).map(function(a){return [a.s,a.rom,dfull(a.d)+' '+a.h,a.sit==='P'?'Em rota':'Baixado c/ pendência',a.pl,cap(a.mot),a.nf,a.ctrc,a.rem,a.dest,cap(a.cid),+a.cod,D.ocor[a.cod]||'',a.dt,dias(a.dt.slice(0,5)),a.fr,a.kg,a.vol,a.merc,a.sa];});
 var bx=B.map(function(a){return [a.s,a.rom,dfull(a.d)+' '+a.h,'Baixado',a.pl,cap(a.mot),a.nf,a.ctrc,a.rem,a.dest,cap(a.cid),'','','','',a.fr,a.kg,a.vol,a.merc,a.sa];});
 return {cab:cab,ab:ab,bx:bx};}
function filtroTxt(){var f=D.fil.filter(function(x){return x[0]===view;})[0];return 'Extração '+D.extracao+' · Filial: '+(f?f[0]:'Visão geral')+' · Data de saída: '+rotBtn()+(motSel?' · Motorista: '+motSel:'')+(busca.length?' · Pesquisa: '+busca.join(', '):'');}
var dlApi=null;(window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)).then(function(x){dlApi=x;var b=document.getElementById('btXls');if(b&&!x){b.title='Exportação indisponível nesta visualização';}}).catch(function(){});
function msgXls(t,ok){var m=document.getElementById('xlsMsg');if(!m)return;m.textContent=t;m.className='xmsg'+(ok?' ok':'');clearTimeout(m._t);m._t=setTimeout(function(){m.textContent='';},5000);}
function baixaDireto(nm,blob){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);}
function exportaXls(){var fora=!(window.claude&&window.claude.use);if(!dlApi&&!fora){msgXls('Exportação indisponível nesta visualização');return;}
 var X=linhasXls();if(!X.ab.length&&!X.bx.length){msgXls('Nada para exportar no filtro atual');return;}
 var W=[6,10,17,20,9,28,10,10,18,28,22,8,36,12,8,12,10,8,16,6];
 var sh=[{name:'Em aberto',rows:[[filtroTxt()],[]].concat([X.cab]).concat(X.ab),headerRow:2,widths:W}];
 if(D.temPrev&&X.bx.length)sh.push({name:'Baixados',rows:[[filtroTxt()],[]].concat([X.cab]).concat(X.bx),headerRow:2,widths:W});
 var blob;try{blob=XLSXMini.build(sh);}catch(err){msgXls('Erro ao montar o Excel');return;}
 var nm='Entregas em aberto - Filial Norte'+(view==='GERAL'?'':' - '+view)+' - '+D.extracao.slice(0,10).split('/').reverse().join('-')+'.xlsx';
 if(!dlApi){baixaDireto(nm,blob);msgXls(X.ab.length+' CTRCs exportados',true);return;}
 dlApi.save({filename:nm,data:blob}).then(function(){msgXls(X.ab.length+' CTRCs exportados',true);}).catch(function(e){var c=e&&e.code;msgXls(c==='declined'?'Exportação cancelada':(c==='rate_limited'?'Aguarde e tente de novo':'Não foi possível exportar aqui'));});}
document.addEventListener('click',function(e){if(e.target.closest('#btXls')){exportaXls();return;}if(e.target.closest('[data-busca-clear]')){var q=document.getElementById('qNF');if(q)q.value='';aplicaBusca('');}});
function render(){renderFilt();renderNav();renderDD();renderMain();}
document.addEventListener('click',function(e){
 var dd=e.target.closest('[data-dd]');if(dd){var w=document.getElementById(dd.getAttribute('data-dd')),o=!w.classList.contains('open');closeDD();if(o)w.classList.add('open');return;}
 if(!e.target.closest('.dd')||e.target.closest('[data-go]'))closeDD();
 var t=e.target.closest('[data-mot]');if(t){var m=t.getAttribute('data-mot');motSel=(motSel===m?null:m);renderMain();return;}
 t=e.target.closest('[data-mot-clear]');if(t){motSel=null;renderMain();return;}
 t=e.target.closest('[data-go]');if(t){e.preventDefault();motSel=null;view=t.getAttribute('data-go');try{history.replaceState(null,'','#'+view);}catch(_){}render();window.scrollTo(0,0);return;}
 t=e.target.closest('[data-act="all"]');if(t){var v=!todos();datas.forEach(function(d){sel[d]=v;});render();return;}
 t=e.target.closest('[data-tog]');if(t){var m=+t.getAttribute('data-tog');aberto[m]=!aberto[m];renderFilt();return;}
 t=e.target.closest('[data-fv]');if(t){var fv=t.getAttribute('data-fv'),hit=function(d){return fv==='*'||(fv.slice(0,2)==='M:'?mesOf(d)===+fv.slice(2):d===fv);};
  if(fv!=='*'&&(e.ctrlKey||e.metaKey||e.shiftKey)){ // seleção múltipla: mantém a lista aberta
   if(todos())datas.forEach(function(d){sel[d]=false;});
   if(e.shiftKey&&fv.slice(0,2)!=='M:'&&lastFv&&lastFv.slice(0,2)!=='M:'){var a=ord(lastFv),b=ord(fv),lo=Math.min(a,b),hi=Math.max(a,b);datas.forEach(function(d){if(ord(d)>=lo&&ord(d)<=hi)sel[d]=true;});}
   else{var ds2=datas.filter(hit),all2=ds2.every(function(d){return sel[d];});ds2.forEach(function(d){sel[d]=!all2;});}
   if(!nSel())datas.forEach(function(d){sel[d]=true;});
   lastFv=fv;renderFilt();renderNav();renderDD();renderMain();var w2=document.getElementById('filt').closest('.dd');if(w2)w2.classList.add('open');return;}
  datas.forEach(function(d){sel[d]=hit(d);});lastFv=fv;closeDD();render();return;}
 t=e.target.closest('[data-mes]');if(t){var m2=+t.getAttribute('data-mes'),ds=datas.filter(function(d){return mesOf(d)===m2;}),all=ds.every(function(d){return sel[d];});ds.forEach(function(d){sel[d]=!all;});render();return;}
 t=e.target.closest('[data-dia]');if(t){var d=t.getAttribute('data-dia');sel[d]=!sel[d];render();return;}
});
if(view!=='GERAL'&&!D.fil.some(function(f){return f[0]===view;}))view='GERAL';
render();
})();
</script>
